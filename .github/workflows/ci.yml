name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  cpu-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install development dependencies
        run: python -m pip install -e ".[dev,ci]"
      - name: Unit tests
        run: python -m pytest
      - name: Ruff
        run: ruff check .
      - name: Mypy
        run: mypy src
