output_dir: outputs/eval_assets_v1

sampling:
  seed: 20260616
  max_utterances_per_source: 2000

hotwords:
  max_per_language: 800
  min_chars: 4
  min_words: 1
  max_words: 4
  max_occurrences: 40
  source_utt_limit: 20

cases:
  cases_per_language: 1000
  active_hotwords_per_case: 10
  positive_ratio: 0.50
  negative_ratio: 0.25
  confusable_ratio: 0.15
  no_hotword_ratio: 0.10

sources:
  - name: librispeech
    dataset: librispeech
    language: en
    root: /home/z00841352/27A/data/LibriSpeech
    include_splits:
      - test-clean
      - test-other
      - dev-clean
      - dev-other

  - name: commonvoice_en
    dataset: commonvoice
    language: en
    root: /home/z00841352/27A/data/Common_Voice_Scripted_Speech_25.0
    include_locales:
      - en
      - en-US
    include_splits:
      - test
      - dev
      - validation
      - validated

  - name: fleurs_en
    dataset: fleurs
    language: en
    root: /home/z00841352/27A/data/Fleurs
    include_locales:
      - en_us
      - en-US
    include_splits:
      - test
      - validation
      - dev

  - name: mls_pt
    dataset: mls
    language: pt-BR
    root: /home/z00841352/27A/data/MLS_Multilingual_LibriSpeech
    include_splits:
      - test
      - dev

  - name: commonvoice_pt
    dataset: commonvoice
    language: pt-BR
    root: /home/z00841352/27A/data/Common_Voice_Scripted_Speech_25.0
    include_locales:
      - pt
      - pt-BR
    include_splits:
      - test
      - dev
      - validation
      - validated

  - name: fleurs_pt
    dataset: fleurs
    language: pt-BR
    root: /home/z00841352/27A/data/Fleurs
    include_locales:
      - pt_br
      - pt-BR
    include_splits:
      - test
      - validation
      - dev

